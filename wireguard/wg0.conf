# SaidZen WiFi - WireGuard server configuration
#
# Copy this file to /etc/wireguard/wg0.conf on the VPN server.
# Replace every value in angle brackets before starting WireGuard.
# Never commit the completed file: it contains the server private key.

[Interface]
Address = 10.8.0.1/24
ListenPort = 51820
PrivateKey = <SERVER_PRIVATE_KEY>

# Router peer 1
[Peer]
PublicKey = <ROUTER1_PUBLIC_KEY>
AllowedIPs = 10.8.0.2/32

# Add another [Peer] block for each additional router.
# Example:
# [Peer]
# PublicKey = <ROUTER2_PUBLIC_KEY>
# AllowedIPs = 10.8.0.3/32
